name: Roll back ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: Previously deployed immutable Git commit SHA
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_secret_arns: ${{ secrets.APP_SECRET_ARNS_JSON }}
      TF_VAR_image_tag: ${{ inputs.image_tag }}
      ROLLBACK_IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: rollback-${{ github.run_id }}-${{ inputs.environment }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
      - name: Load optional environment configuration
        shell: bash
        env:
          ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
          APP_ENV_JSON: ${{ vars.APP_ENV_JSON }}
        run: |
          if [[ -n "$ACM_CERTIFICATE_ARN" ]]; then
            echo "TF_VAR_certificate_arn=$ACM_CERTIFICATE_ARN" >> "$GITHUB_ENV"
          fi
          if [[ -n "$APP_ENV_JSON" ]]; then
            echo "TF_VAR_additional_environment=$APP_ENV_JSON" >> "$GITHUB_ENV"
          fi
      - name: Initialize Terraform state
        working-directory: infra
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=lacrei-api/${{ inputs.environment }}/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Verify rollback image exists
        working-directory: infra
        run: |
          REPOSITORY_NAME="$(terraform output -raw ecr_repository_name)"
          aws ecr describe-images --repository-name "$REPOSITORY_NAME" --image-ids imageTag="$ROLLBACK_IMAGE_TAG" >/dev/null
      - name: Plan rollback
        working-directory: infra
        run: >-
          terraform plan
          -out=tfplan
          -target=aws_ecs_task_definition.app
          -target=aws_ecs_service.app
          -var-file="environments/${{ inputs.environment }}.tfvars.example"
      - name: Apply previous task definition
        working-directory: infra
        run: terraform apply -auto-approve tfplan
      - name: Verify service stability
        working-directory: infra
        run: >-
          aws ecs wait services-stable
          --cluster "$(terraform output -raw ecs_cluster_name)"
          --services "$(terraform output -raw ecs_service_name)"
