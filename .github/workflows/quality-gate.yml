name: Reusable quality gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install poetry==2.2.1
      - run: poetry install --no-interaction --no-ansi
      - run: poetry check --strict
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run bandit -q -r apps config -x '*/tests/*'

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: lacrei_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lacrei_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lacrei_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install poetry==2.1.4
      - run: poetry install --no-interaction --no-ansi
      - run: poetry run python manage.py makemigrations --check --dry-run
      - run: poetry run python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yml
      - run: poetry run coverage run manage.py test
      - run: poetry run coverage report
